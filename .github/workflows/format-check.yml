name: Format Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '26'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Generate configuration
        run: vp node scripts/generate-github-config.js

      - name: Check format, lint, and types
        run: vp check

      - name: Validate README parsing
        run: vp run parse-readme

      - name: Test directory walker and filters
        run: node --test scripts/parse-readme.test.js lib/groupFilters.test.js lib/entryIcon.test.js
